<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🏝️ 数学冒险岛</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Nunito', 'Noto Sans SC', sans-serif;
    background: #FFF8F0;
    min-height: 10vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    background: #FFFFFF;
    border-radius: 24px;
    padding: 48px;
    box-shadow: 0 8px 32px rgba(121,79,39,0.12);
    text-align: center;
    max-width: 480px;
  }
  h1 { font-size: 2.5em; margin-bottom: 8px; }
  p { color: #794f27; margin-bottom: 32px; font-size: 1.1em; }
  a.btn {
    display: inline-block;
    background: linear-gradient(135deg, #A8D8B9, #8CC49F);
    color: #fff;
    text-decoration: none;
    padding: 16px 40px;
    border-radius: 50px;
    font-size: 1.2em;
    font-weight: 700;
    box-shadow: 0 4px 0 #6BA37E;
    transition: all 0.15s;
  }
  a.btn:hover { transform: translateY(-2px); box-shadow: 0 6px 0 #6BA37E; }
  a.btn:active { transform: translateY(2px); box-shadow: 0 2px 0 #6BA37E; }
</style>
</head>

  <div class="card">
    <h1>🏝️ 数学冒险岛</h1>
    <p>用图形理解乘法是怎么算的</p>
